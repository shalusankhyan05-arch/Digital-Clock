<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>My Digital Clock</h1>
    <p id="time">00:00:00</p>
    <p id="date"></p>

    <div class="buttons">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="themeBtn">Change Theme</button>
    </div>
  </div>
  <div id ="popup">
    <div class="box">
      <h2> Choose Background</h2>
      <div class="photos">
        <img src="photo no. 1.jpg">
        <img src="photo no. 2.jpg">
        <img src="photo no. 3.jpg">
        <img src="photo no. 4.jpg">
        <img src="photo no. 5.jpg">
        <img src="photo no. 6.jpg">
        <img src="photo no. 7.jpg">
        <img src="photo no. 8.jpg">
        <img src="photo  no. 9.jpg">

      </div>
      <button id="closeBtn">Close</button>
    </div>
  </div>

  <script src="first.js"></script>
</body>
</html>
